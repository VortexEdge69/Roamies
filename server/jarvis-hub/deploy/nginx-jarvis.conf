# Jarvis Hub behind nginx (use this instead of Caddy when nginx already owns ports 80/443 on the VPS).
#   sudo cp nginx-jarvis.conf /etc/nginx/sites-available/jarvis
#   sudo ln -sf /etc/nginx/sites-available/jarvis /etc/nginx/sites-enabled/jarvis
#   sudo certbot --nginx -d jarvis.vecrahost.in        (first time, for the certificate)
#   sudo nginx -t && sudo systemctl reload nginx
#
# No auth_basic: every API call and the live socket already need a device token, and nginx's basic auth
# would take over the Authorization header. (If you add auth_basic anyway, the hub still works: the web
# client sends its token as X-Jarvis-Token.) Don't clear or rewrite Authorization / X-Jarvis-Token here.

map $http_upgrade $jarvis_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name jarvis.vecrahost.in;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name jarvis.vecrahost.in;

    ssl_certificate     /etc/letsencrypt/live/jarvis.vecrahost.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jarvis.vecrahost.in/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;
    client_max_body_size 12m;          # voice clips for /v1/transcribe

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        # WebSockets (/v1/live for every device, /v1/audio for the pendant)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $jarvis_connection;

        # The hub uses X-Forwarded-For for its failed-login lockout, and sees the real host/scheme
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 1h;             # live sockets stay open; the hub pings every 30 s
        proxy_send_timeout 1h;
        proxy_buffering off;
    }
}
